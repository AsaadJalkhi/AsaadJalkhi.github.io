<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="ASAAD.OS — Marketing, Creative, Digital">
  <defs>
    <linearGradient id="glow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#E85A2A" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#E85A2A" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 H0 V60" fill="none" stroke="#F2EDE4" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#08080A"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <g font-family="Space Grotesk, Segoe UI, system-ui, sans-serif">
    <text x="88" y="196" fill="#99938A" font-size="20" letter-spacing="8">P O R T F O L I O</text>

    <text x="84" y="330" fill="#F2EDE4" font-size="128" font-weight="600" letter-spacing="-3">ASAAD.OS</text>

    <text x="88" y="398" fill="#E85A2A" font-size="26" letter-spacing="5">MARKETING / CREATIVE / DIGITAL</text>

    <text x="88" y="486" fill="#E7E2D9" font-size="34">Different projects. Same mind.</text>

    <text x="88" y="562" fill="#5F5A53" font-size="19" letter-spacing="2" font-family="JetBrains Mono, Consolas, monospace">BRAND · CAMPAIGNS · CONTENT · VIDEO · WEB · SYSTEMS</text>
  </g>

  <g transform="translate(1010 250)">
    <circle cx="0" cy="0" r="17" fill="#E2AC4C"/>
    <circle cx="48" cy="0" r="17" fill="#E85A2A"/>
    <circle cx="96" cy="0" r="17" fill="#74D6BD"/>
  </g>

  <rect x="88" y="524" width="64" height="2" fill="#E85A2A"/>
</svg>
